<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - PenguinPay</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="admin-login-wrapper">
      <div class="admin-login-box">
        <div style="text-align: center; margin-bottom: 24px;">
          <img src="/penguinpay-logo.png" alt="PenguinPay" style="display:block;width:96px;height:96px;object-fit:contain;margin:0 auto 12px;border-radius:24px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.16));" />
        </div>
        <div class="admin-title">Admin Portal</div>
        <form id="adminLoginForm">
          <input
            type="email"
            id="email"
            class="admin-input"
            placeholder="admin@penguinpay.com"
            required
          />
          <input
            type="password"
            id="password"
            class="admin-input"
            placeholder="Password"
            required
          />
          <div id="errorMsg" class="hidden" style="color: #ef4444; text-align: center; margin-bottom: 16px; font-size: 14px;"></div>
          <button type="submit" class="admin-btn">Login</button>
        </form>
      </div>
    </div>

    <script type="module" src="../../user-app/js/config/supabase.js"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
